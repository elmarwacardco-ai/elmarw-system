name: App checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            api/package-lock.json
      - name: Install API dependencies
        run: npm install --prefix api --no-audit --no-fund
      - name: Syntax-check backend
        run: |
          node --check api/index.js
          node --check api/customer.js
          node --check api/whatsapp-drafts.js
      - name: Run customer API tests
        run: node --test api/customer.test.js api/security.test.js api/index.test.js api/whatsapp-drafts.test.js
      - name: Validate manual WhatsApp contact links
        run: node --test web/src/whatsapp.test.js
      - name: Check deployed preview HTTP endpoints (diagnostic only)
        continue-on-error: true # Promote to a required check after preview network access is verified.
        env:
          ELMARWA_SMOKE_URL: https://elmarw-kga2prrn8-waled4.vercel.app/
        run: node --test api/preview-smoke.test.js
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Build React app
        run: npm run build --prefix web
